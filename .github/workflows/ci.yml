name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: make lint
      - run: make test
      - run: make web-build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg redis-server
      - name: install mediamtx
        run: |
          curl -fsSL -o /tmp/mtx.tar.gz https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_linux_amd64.tar.gz
          mkdir -p /tmp/mtx && tar -xzf /tmp/mtx.tar.gz -C /tmp/mtx
          echo "MEDIAMTX_BIN=/tmp/mtx/mediamtx" >> "$GITHUB_ENV"
      - run: make test-integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server
      - run: make venv web-install
      - run: cd web && npx playwright install --with-deps chromium
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  compose-and-arm64-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose file
        run: |
          python3 scripts/init_env.py --output .env >/dev/null
          docker compose config -q
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: build app image for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: build web image for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
